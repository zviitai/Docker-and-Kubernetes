version: "3.8"

# ──────────────────────────────────────────────────────────────────────────────
# Local dev stack: Elasticsearch + Kibana
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Destroy: docker compose down -v   (also deletes stored data)
#
# After ~30 s run the analyser against this stack:
#   ELASTIC_URL=http://localhost:9200 \
#   PCAP_PATH=sample.pcap \
#   python main.py
# ──────────────────────────────────────────────────────────────────────────────

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node      # single-node mode – no cluster needed for dev
      - xpack.security.enabled=false    # disable TLS + auth for local dev ease
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # cap heap so it doesn't eat your laptop RAM
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es_data:
    driver: local
